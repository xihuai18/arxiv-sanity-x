# LiteLLM Configuration Template
# Copy this file to config/llm.yml and fill in your API keys
# Usage: cp config/llm_template.yml config/llm.yml
#
# LiteLLM acts as a unified gateway for multiple LLM providers.
# Start with: litellm -c config/llm.yml --port 53000
# Or use: python bin/run_services.py (auto-starts LiteLLM)
# Note: the repository code defaults are `ARXIV_SANITY_LLM_NAME=gpt-5.4` and
# `ARXIV_SANITY_EXTRACT_MODEL_NAME=qwen3.5-plus`, but this starter template only
# defines the OpenRouter aliases below. If you copy it unchanged, also override
# those env vars to one of the aliases here, or add matching routes.

model_list:
  # OpenRouter - Recommended for free models
  # Get your API key at: https://openrouter.ai/keys
  - model_name: or-mimo
    litellm_params:
      model: openrouter/xiaomi/mimo-v2-flash:free
      api_base: https://openrouter.ai/api/v1
      api_key: YOUR_OPENROUTER_API_KEY  # Replace with your key
      max_tokens: 32768
      extra_body:
        reasoning:
          effort: "medium"
    model_info:
      supports_reasoning: True

  - model_name: or-glm
    litellm_params:
      model: openai/z-ai/glm-4.5-air:free
      api_base: https://openrouter.ai/api/v1
      api_key: YOUR_OPENROUTER_API_KEY  # Replace with your key
      max_tokens: 32768
    model_info:
      supports_reasoning: True

  - model_name: or-gpt-oss-120b
    litellm_params:
      model: openrouter/openai/gpt-oss-120b:free
      api_base: https://openrouter.ai/api/v1
      api_key: YOUR_OPENROUTER_API_KEY  # Replace with your key
      max_tokens: 32768
    model_info:
      supports_reasoning: True

litellm_settings:
  drop_params: true
