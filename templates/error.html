{% extends "base.html" %}

{% block content %}
<div class="error-page" role="main">
    <h1 class="error-page-title">{{ status_code }}{% if title %} - {{ title }}{% endif %}</h1>
    <p class="error-page-message">{{ message }}</p>
    <p class="error-page-actions">
        <a href="/" class="btn btn-primary">Go Home</a>
        <a href="/profile" class="btn btn-cancel">Profile</a>
    </p>
</div>
{% endblock %}
